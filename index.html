<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Pineapple Simulator</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍍</text></svg>" />
  </head>
  <body>
    <div id="stage"></div>

    <div id="menu" class="screen">
      <div class="menu-card">
        <h1 class="title"><span>Pineapple</span><span>Simulator</span></h1>
        <div class="buttons">
          <button id="btn-arcade" class="btn primary">Arcade Mode</button>
          <button id="btn-realistic" class="btn">Realistic Mode</button>
        </div>
        <button id="btn-sound" class="sound-toggle" aria-pressed="true">Sound: On</button>
      </div>
    </div>

    <div id="hud" class="hidden">
      <button id="hud-menu" class="icon-btn" aria-label="Menu">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
      </button>
      <button id="hud-sound" class="icon-btn" aria-label="Sound">
        <svg class="on" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z" /><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" /></svg>
        <svg class="off" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z" /><path d="M17 9l5 6M22 9l-5 6" /></svg>
      </button>
    </div>

    <div id="void" class="hidden"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
